    <!-- Inline script for basic toggle interactivity (optional but enhances UX) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            if (params.has('contact')) {
                document.getElementById('identifier').value = params.get('contact');
            }
        });

        // Pilih semua tombol yang di dalamnya memiliki ikon gambar (img)
        document.querySelectorAll('button:has(img)').forEach(button => {
            button.addEventListener('click', function () {
                // Mengambil input sebelum tombol dan elemen img di dalam tombol
                const input = this.previousElementSibling;
                const icon = this.querySelector('img');

                if (input.type === 'password') {
                    input.type = 'text';
                    // Saat password terlihat, tampilkan ikon mata tertutup/dicoret
                    icon.src = 'asset/eye-off-svgrepo-com.svg';
                } else {
                    input.type = 'password';
                    // Saat password tersembunyi, tampilkan ikon mata terbuka
                    icon.src = 'asset/eye-svgrepo-com.svg';
                }
            });
        });

        // Polyfill for :contains selector in vanilla JS for the above listener
        // A more robust way:
        const toggleButtons = document.querySelectorAll('.relative button');
        toggleButtons.forEach(button => {
            button.addEventListener('click', function () {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('img');
                if (input && icon) {
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.src = 'asset/eye-off-svgrepo-com.svg';
                    } else {
                        input.type = 'password';
                        icon.src = 'asset/eye-svgrepo-com.svg';
                    }
                }
            });
        });

    </script>
