<body
    class="bg-surface-container-lowest text-on-surface font-body-lg antialiased min-h-screen flex flex-col items-center">
    <!-- Main Container -->
    <main class="w-full max-w-[450px] px-container-padding py-8 flex flex-col flex-grow">
        <!-- Header -->
        <header class="w-full flex items-center mb-8">
            <button onclick="history.back()"
                class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
                <img src="asset/arrow-back-sharp-svgrepo-com.svg" alt="Kembali" style="width: 24px; height: 24px;">
            </button>
        </header>
        <!-- Content -->
        <div class="flex flex-col gap-stack-md mb-stack-lg">
            <h1 class="font-headline-lg text-headline-lg">Atur ulang kata sandi</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Masukkan e-mail atau nomor HP yang terdaftar.
                Kami akan mengirimkan kode verifikasi untuk atur ulang kata sandi.</p>
        </div>
        <!-- Form -->
        <form action="reset_pass.html" class="flex flex-col gap-stack-lg" onsubmit="this.querySelector('button[type=submit]').disabled = true; this.querySelector('button[type=submit]').innerHTML = 'Memproses...';">
            <div class="relative w-full">
                <input
                    class="peer w-full h-input-height border-b border-surface-variant bg-transparent px-0 pt-4 pb-1 font-body-lg text-body-lg text-on-surface placeholder-transparent focus:border-primary-container focus:outline-none focus:ring-0 transition-colors"
                    id="contact" name="contact" placeholder=" " required="" type="text" />
                <label
                    class="absolute left-0 top-1 text-on-surface-variant font-label-md text-label-md transition-all peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:font-body-md peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:-translate-y-0 peer-focus:font-label-md peer-focus:text-label-md peer-focus:text-primary-container pointer-events-none"
                    for="contact">Nomor HP atau Email</label>
            </div>
            <button
                class="w-full h-button-height bg-primary-container hover:bg-on-primary-fixed-variant text-on-primary font-headline-md text-headline-md rounded-lg mt-4 transition-colors flex items-center justify-center"
                type="submit">
                Lanjut
            </button>
        </form>
    </main>
    <!-- Footer Component Context -->
    <footer class="w-full py-12 bg-transparent flex flex-col md:flex-row justify-center items-center gap-4 mt-auto">
        <span class="font-body-md text-body-md text-on-surface-variant">© 2009-2024, PT Tokopedia</span>
        <a class="font-body-md text-body-md text-on-surface-variant hover:text-primary-container transition-colors cursor-pointer"
            href="#">Bantuan</a>
</body>

</html>
