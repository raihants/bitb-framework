<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Successful</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .card {
            background: white; padding: 44px 28px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center; width: 320px; max-width: 92%;
        }
        .circle {
            width: 76px; height: 76px; background: #22c55e;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 22px;
            animation: pop .4s ease-out;
        }
        .circle svg { width: 38px; height: 38px; stroke: white; stroke-width: 3; fill: none; }
        @keyframes pop {
            0%   { transform: scale(0); opacity: 0; }
            70%  { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 { font-size: 22px; color: #111; margin-bottom: 10px; }
        p  { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: block; width: 100%; padding: 13px;
            background: #22c55e; color: white; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer;
        }
        .btn:active { background: #16a34a; }
    </style>
</head>
<body>
<div class="card">
    <div class="circle">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Successfully Connected</h1>
    <p>You now have full access to the network.<br>This window will close automatically.</p>
    <button class="btn" onclick="window.close()">Start Browsing</button>
</div>
</body>
</html>
